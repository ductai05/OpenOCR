Global:
  device: gpu
  epoch_num: 5                        # 5 epochs fine-tuning chuẩn khớp 1:1 baseline SVTR
  log_smooth_window: 20
  print_batch_step: 20                # In log mỗi 20 steps
  output_dir: ./output/rec/svtrv2_tiny_latin_lpr/
  save_epoch_step: [1, 1]
  eval_batch_step: [0, 2000]          # Đánh giá định kỳ trên val_data mỗi 2.000 steps
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False      # TẮT: loại bỏ nghẽn CPU, GPU chạy max tốc độ
  pretrained_model: ./pretrained_svtrv2_tiny/best.pth   # File weights pretrained SVTRv2-T
  checkpoints:
  use_tensorboard: False
  character_dict_path: &character_dict_path ./dict_latin_38.txt
  delimiter_split_char_oneline: &delimiter_split_char_oneline ","
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False
  save_res_path: ./output/rec/svtrv2_tiny_latin_lpr/predicts.txt
  use_amp: True
  accumulation_steps: 2               # Gradient accumulation: 64 x 2 = 128 (đảm bảo toán học 1:1 với batch 128)

Optimizer:
  name: AdamW
  lr: 0.0005                          # Base LR = 5e-4 chuẩn cho fine-tune
  weight_decay: 0.05
  filter_bias_and_bn: True            # Không phạt weight decay cho Norm và Bias

LRScheduler:
  name: CosineAnnealingLR             # Cosine Annealing khớp 1:1 với baseline SVTR
  warmup_epoch: 1.0                   # Warmup 1 epoch đầu

Architecture:
  model_type: rec
  algorithm: SVTRv2
  Transform:                          # Loại bỏ STN/TPS (FRM giải quyết biển 2 tầng / stacked plate)
  Encoder:
    name: SVTRv2LNConvTwo33
    max_sz: [64, 256]                 # Khớp input shape [64, 256]
    use_pos_embed: False              # Linh hoạt độ dài
    dims: [64, 128, 256]              # Phân khúc Tiny 5.1M params
    depths: [3, 6, 3]                 # Tổng 12 mixing blocks
    num_heads: [2, 4, 8]
    mixer: [['Conv','Conv','Conv'],['Conv','Conv','Conv','FGlobal','Global','Global'],['Global','Global','Global']]
    sub_k: [[1, 1], [2, 1], [1, 1]]
    last_stage: False
    feat2d: True                      # Giữ đặc trưng 2D cho FRM xử lý
  Decoder:
    name: RCTCDecoder                 # Feature Rearranging Module (FRM) + CTC Head
    return_feats: False

Loss:
  name: CTCLoss
  zero_infinity: True

PostProcess:
  name: CTCLabelDecode
  character_dict_path: *character_dict_path
  delimiter_split_char_oneline: *delimiter_split_char_oneline
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: LMDBDataSet
    data_dir: ./train_data
    transforms:
      - DecodeImage:
          img_mode: RGB
          channel_first: False
      - CTCLabelEncode:
          character_dict_path: *character_dict_path
          delimiter_split_char_oneline: *delimiter_split_char_oneline
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecRanInvert:                 # Đảo màu ngẫu nhiên âm bản/dương bản (khớp baseline 0.4)
          random_prob: 0.4
      - SVTRResize:
          image_shape: [3, 64, 256]   # [C, H, W] - Giữ H=64 cho biển 2 dòng
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: True
    batch_size_per_card: 64           # 64 samples/batch vừa vặn hoàn hảo trong 11GB VRAM
    drop_last: True
    num_workers: 8                    # 8 luồng CPU load dữ liệu cực nhanh

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: ./val_data
    transforms:
      - DecodeImage:
          img_mode: RGB
          channel_first: False
      - CTCLabelEncode:
          character_dict_path: *character_dict_path
          delimiter_split_char_oneline: *delimiter_split_char_oneline
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - SVTRResize:
          image_shape: [3, 64, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 64
    num_workers: 4

Export:
  export_shape: [1, 3, 64, 256]
  dynamic_axes: [0, 3]