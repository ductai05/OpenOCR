Global:
  device: gpu
  epoch_num: 30
  log_smooth_window: 50
  print_batch_step: 100
  output_dir: ./output/rec/svtrv2_tiny_latin_lpr_v8/
  save_epoch_step: [1, 1]
  eval_batch_step: [0, 5000]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False
  # Pretrain goc cua tac gia (ban 1 kenh grayscale chuyen tu best.pth Union14M-L)
  pretrained_model: /home/cdengine/Desktop/Tai-exp/SVTRv2-Tiny/best_1ch.pth
  checkpoints:
  use_tensorboard: False
  character_dict_path: &character_dict_path ./dict_latin_38.txt
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False
  save_res_path: ./output/rec/svtrv2_tiny_latin_lpr_v8/predicts.txt
  use_amp: True
  accumulation_steps: 1
  grad_clip_val: 5.0

Optimizer:
  name: AdamW
  lr: 0.0005
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: CosineAnnealingLR
  warmup_epoch: 2.0

Architecture:
  model_type: rec
  algorithm: SVTRv2
  in_channels: 1
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    in_channels: 1
    use_pos_embed: False
    dims: [64, 128, 256]
    depths: [3, 6, 3]
    num_heads: [2, 4, 8]
    mixer: [['Conv','Conv','Conv'], ['Conv','Conv','Conv','FGlobal','Global','Global'], ['Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: False
    feat2d: True
  Decoder:
    name: RCTCDecoder
    return_feats: False

Loss:
  name: CTCLoss
  zero_infinity: True

PostProcess:
  name: CTCLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: LMDBDataSet
    data_dir: ./train_data
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: False
      - CTCLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecRanInvert:
          random_prob: 0.4
      - BaseDataAugmentation:
          blur_prob: 0.35
          noise_prob: 0.30
          jitter_prob: 0.30
          crop_prob: 0.20
          hsv_aug_prob: 0.0
          reverse_prob: 0.0
      - SVTRResize:
          image_shape: [1, 64, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: True
    batch_size_per_card: 64
    drop_last: True
    num_workers: 4

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: ./val_data_unified
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: False
      - CTCLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - SVTRResize:
          image_shape: [1, 64, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 64
    num_workers: 2

Export:
  export_shape: [1, 1, 64, 256]
  dynamic_axes: [0, 3]
