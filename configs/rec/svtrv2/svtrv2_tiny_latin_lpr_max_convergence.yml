Global:
  device: gpu
  epoch_num: 15                       # 15 epochs hội tụ sâu tối đa trên 2M mẫu (234.375 steps)
  log_smooth_window: 20
  print_batch_step: 50               # In log mỗi 50 steps (gọn gàng log)
  output_dir: ./output/rec/svtrv2_tiny_latin_lpr_max_conv/
  save_epoch_step: [1, 1]            # Lưu checkpoint định kỳ sau mỗi epoch
  eval_batch_step: [0, 2500]         # Đánh giá định kỳ trên 10K val mẫu mỗi 2.500 steps
  eval_epoch_step: [0, 1]            # Luôn đánh giá tổng thể sau mỗi epoch
  cal_metric_during_train: False     # TẮT: triệt tiêu nghẽn CPU, giải phóng 100% công suất GPU
  pretrained_model: ./pretrained_svtrv2_tiny/best.pth  # Nạp weights pretrain từ Union14M
  checkpoints:
  use_tensorboard: False
  character_dict_path: &character_dict_path ./dict_latin_38.txt
  delimiter_split_char_oneline: &delimiter_split_char_oneline ","
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False
  save_res_path: ./output/rec/svtrv2_tiny_latin_lpr_max_conv/predicts.txt
  use_amp: True                      # True cho RTX 2080 Ti (Tensor Cores); Đổi False nếu chạy trên GTX 1080 Ti
  accumulation_steps: 2              # Effective batch size: 64 x 2 = 128 (chuẩn toán học khớp 1:1 SVTR baseline)
  grad_clip_val: 5.0                 # Gradient clipping chống sốc gradient cho CTC & Transformer

Optimizer:
  name: AdamW
  lr: 0.0004                         # Base LR = 4e-4: Sweet spot cân bằng giữa hội tụ nhanh và ổn định
  weight_decay: 0.05
  filter_bias_and_bn: True           # Loại trừ Norm và Bias khỏi weight decay

LRScheduler:
  name: CosineAnnealingLR            # Cosine Annealing chu kỳ 15 epochs đưa LR về tiệm cận 1e-6
  warmup_epoch: 1.0                  # 1 epoch warmup (~15.625 steps) bảo vệ weights pretrain, làm ấm FRM Attention

Architecture:
  model_type: rec
  algorithm: SVTRv2
  Transform:                         # KHÔNG dùng STN (FRM xử lý trực tiếp biển 2 dòng mà không làm méo ảnh)
  Encoder:
    name: SVTRv2LNConvTwo33
    max_sz: [64, 256]                # Input shape [H=64, W=256] - Giữ độ phân giải dọc cho stacked plates
    use_pos_embed: False
    dims: [64, 128, 256]             # Phân khúc Tiny 5.1M params (đối đầu trực tiếp SVTR-Tiny)
    depths: [3, 6, 3]                # Tổng 12 mixing blocks
    num_heads: [2, 4, 8]
    mixer: [['Conv','Conv','Conv'],['Conv','Conv','Conv','FGlobal','Global','Global'],['Global','Global','Global']]
    sub_k: [[1, 1], [2, 1], [1, 1]]  # Giữ kích thước đặc trưng dọc H/8 = 8 feature maps
    last_stage: False
    feat2d: True                     # Giữ đặc trưng 2D cho FRM xử lý
  Decoder:
    name: RCTCDecoder                # Feature Rearranging Module (FRM Cross-Attention) + CTC Head
    return_feats: False

Loss:
  name: CTCLoss
  zero_infinity: True                # Triệt tiêu vô hạn nếu xảy ra lỗi CTC alignment

PostProcess:
  name: CTCLabelDecode
  character_dict_path: *character_dict_path
  delimiter_split_char_oneline: *delimiter_split_char_oneline
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: LMDBDataSet
    data_dir: ./train_data           # Tập Latin LMDB-2M chuẩn
    transforms:
      - DecodeImage:
          img_mode: RGB
          channel_first: False
      - CTCLabelEncode:
          character_dict_path: *character_dict_path
          delimiter_split_char_oneline: *delimiter_split_char_oneline
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - RecRanInvert:                # Đảo âm/dương bản ngẫu nhiên 40% (bảo toàn đặc thù biển số xe)
          random_prob: 0.4
      - SVTRResize:
          image_shape: [3, 64, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: True
    batch_size_per_card: 64          # 64 x 2 (accumulation) = 128
    drop_last: True
    num_workers: 8

Eval:
  dataset:
    name: LMDBDataSet
    data_dir: ./val_data_unified     # Tập Validation hợp nhất chuẩn 10.002 mẫu từ 7 domains
    transforms:
      - DecodeImage:
          img_mode: RGB
          channel_first: False
      - CTCLabelEncode:
          character_dict_path: *character_dict_path
          delimiter_split_char_oneline: *delimiter_split_char_oneline
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - SVTRResize:
          image_shape: [3, 64, 256]
          padding: False
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 64
    num_workers: 4

Export:
  export_shape: [1, 3, 64, 256]
  dynamic_axes: [0, 3]
